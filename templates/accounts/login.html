{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}

<div class="card my-5 ">
    <div class="card-header fs-4 text-center py-3">Логин</div>
    <div class="card-body">
        <form action="" id="login-form" method="POST">
            {% csrf_token %}
            {% bootstrap_form form layout="floating" %}
        </form>
    </div>
    <div class="card-footer text-end py-3">
        <button type="submit" form="login-form" class="btn btn-sm btn-primary">
            Войти</button>
    </div>
</div>

{% endblock %}
